name: Tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '^7.0'
            pest: '^2.0'
          - php: '8.2'
            testbench: '^8.0'
            pest: '^2.0'
          - php: '8.3'
            testbench: '^9.0'
            pest: '^3.0'
          - php: '8.3'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            testbench: '^11.0'
            pest: '^5.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev --no-update orchestra/testbench:${{ matrix.testbench }} pestphp/pest:${{ matrix.pest }} pestphp/pest-plugin-laravel:${{ matrix.pest }}
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pest
